<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- ส่วนหัวชื่อแอปสไตล์นีออน -->
    <div class="header">
      <span class="brand-text">BLINK<span class="highlight">QR</span></span>
    </div>
    
    <!-- ฝังโลโก้ตาเหยี่ยวดิจิทัลตรงกลาง UI -->
    <div class="logo-container">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="75" height="75">
        <defs>
          <linearGradient id="falconOrange" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff5500" />
            <stop offset="100%" stop-color="#ffaa00" />
          </linearGradient>
        </defs>
        <path d="M 20 70 Q 56 30 108 48 Q 60 90 20 70 Z" stroke="#4b5563" stroke-width="4" stroke-linejoin="round" fill="none" />
        <rect x="48" y="44" width="32" height="32" rx="5" fill="url(#falconOrange)" />
        <rect x="54" y="50" width="20" height="20" rx="2" fill="#17181c" />
        <rect x="58" y="54" width="12" height="12" rx="1" fill="url(#falconOrange)" />
        <rect x="100" y="54" width="6" height="6" rx="1" fill="url(#falconOrange)" opacity="0.8" />
        <rect x="110" y="58" width="4" height="4" rx="1" fill="url(#falconOrange)" opacity="0.5" />
      </svg>
    </div>

    <!-- ปุ่มกดทาสีแบ่งฝั่งโหมดการทำงาน -->
    <div class="actions-grid">
      <button id="cropBtn" class="btn btn-crop">
        <span class="btn-icon">📷</span>
        <span>ลากครอบสแกน</span>
      </button>
      
      <div class="upload-wrapper">
        <label for="fileInput" class="btn btn-upload">
          <span class="btn-icon">📁</span>
          <span>อัปโหลดรูปภาพ</span>
        </label>
        <input type="file" id="fileInput" accept="image/*" style="display: none;">
      </div>
    </div>

    <!-- กล่องแสดงผลลัพธ์สไตล์หน้าต่างมอนิเตอร์ -->
    <div id="resultContainer" class="result-box" style="display: none;">
      <div class="result-header">
        <span class="status-indicator">●</span> Result Log
      </div>
      <div id="resultText" class="result-content"></div>
      <button id="copyBtn" class="btn-copy">📋 คัดลอกข้อความ</button>
    </div>
  </div>

  <!-- ระบบประมวลผลเบื้องหลัง -->
  <canvas id="popupCanvas" style="display: none;"></canvas>
  <script src="libs/jsQR.js"></script>
  <script src="popup.js"></script>
</body>
</html>
